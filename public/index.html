<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高校课程协作与评审平台</title>
<style>
  :root{
    --primary:#1f4e79;--primary-2:#2b5f92;--bg:#f4f6f9;--card:#fff;--line:#e2e8f0;
    --text:#1c2b3a;--muted:#6b7c8f;--ok:#2f7a4a;--ok-bg:#eef7f2;
    --warn:#b3541e;--warn-bg:#fdf3ec;--danger:#b02a1f;--danger-bg:#fdeeec;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.65 "Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}
  button,input,select,textarea{font:inherit}
  .hidden{display:none!important}

  /* 登录 */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#1f4e79,#2b6ca3 60%,#3f8ac2)}
  .login-card{width:380px;background:#fff;border-radius:16px;padding:32px 30px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .login-card h1{font-size:19px;margin:0 0 4px;color:var(--primary)}
  .login-card p{color:var(--muted);font-size:12.5px;margin:0 0 20px}
  .login-card label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px}
  .login-card input{width:100%;padding:10px 12px;border:1px solid #cfd8e3;border-radius:9px}
  .login-card .btn{width:100%;margin-top:18px;justify-content:center}
  .demo{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}
  .demo span{display:inline-block;margin:3px 4px 0 0;padding:3px 9px;border:1px solid #c9d8e8;
    border-radius:20px;font-size:12px;color:var(--primary);cursor:pointer}
  .demo span:hover{background:#eef4fd}
  .err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:18px}

  /* 布局 */
  header.topbar{height:58px;background:var(--primary);color:#fff;display:flex;align-items:center;
    padding:0 20px;gap:14px;position:sticky;top:0;z-index:20}
  header.topbar .brand{font-weight:700;font-size:15.5px;white-space:nowrap}
  header.topbar .spacer{flex:1}
  header.topbar .chip{font-size:12px;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:20px}
  header.topbar button{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;
    border-radius:7px;padding:5px 12px;cursor:pointer;font-size:12.5px}
  .bell{position:relative;cursor:pointer;font-size:17px}
  .bell i{position:absolute;top:-6px;right:-10px;background:#e2574c;color:#fff;font-style:normal;
    font-size:10px;border-radius:9px;padding:0 5px}
  .shell{display:flex;min-height:calc(100vh - 58px)}
  aside{width:200px;background:#fff;border-right:1px solid var(--line);padding:14px 10px;flex:none}
  aside .who{padding:10px 12px;background:#f7fafd;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
  aside .who b{display:block}
  aside .who span{font-size:12px;color:var(--muted)}
  nav a{display:block;padding:9px 12px;border-radius:8px;color:#33475b;font-size:13.5px;cursor:pointer;margin-bottom:3px}
  nav a:hover{background:#f2f6fb}
  nav a.active{background:#e8f1fb;color:var(--primary);font-weight:700}
  main{flex:1;padding:20px 24px 40px;max-width:1200px}
  h1{font-size:20px;margin:0 0 3px}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}

  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 12px;color:var(--primary);display:flex;align-items:center;gap:8px}
  .grid{display:grid;gap:12px}
  .grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat b{display:block;font-size:26px;color:var(--primary);line-height:1.2}
  .stat span{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{color:var(--muted);font-weight:600;background:#fafbfd}
  tr:last-child td{border-bottom:0}
  .badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;border:1px solid transparent}
  .b-ok{background:var(--ok-bg);color:var(--ok);border-color:#cfe7d8}
  .b-warn{background:var(--warn-bg);color:var(--warn);border-color:#f3d5c4}
  .b-info{background:#eef4fd;color:var(--primary);border-color:#d4e3f6}
  .b-muted{background:#f4f6f8;color:var(--muted);border-color:#e2e8f0}
  .kv{display:grid;grid-template-columns:110px 1fr;row-gap:7px;font-size:13px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0}
  label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=number],input[type=password],input[type=date],textarea,select{
    width:100%;border:1px solid #cfd8e3;border-radius:8px;padding:8px 10px;background:#fff;color:var(--text)}
  textarea{min-height:72px;resize:vertical}
  .btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;padding:8px 15px;
    background:var(--primary);color:#fff;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--primary-2)}
  .btn.ghost{background:#fff;color:var(--primary);border:1px solid #c9d8e8}
  .btn.sm{padding:4px 10px;font-size:12.5px}
  .btn:disabled{background:#b9c4d0;cursor:not-allowed}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .note{font-size:12.5px;color:var(--muted);background:#fafbfd;border-left:3px solid #c9d8e8;
    padding:8px 12px;border-radius:0 6px 6px 0;margin-top:10px}
  .empty{padding:24px;text-align:center;color:var(--muted)}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1c2b3a;color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;z-index:99}
  #toast.show{opacity:1}
  .modal-mask{position:fixed;inset:0;background:rgba(15,25,35,.45);display:flex;align-items:center;
    justify-content:center;z-index:50}
  .modal{background:#fff;border-radius:14px;padding:22px;width:560px;max-width:92vw;max-height:86vh;overflow:auto}
  .modal h3{margin:0 0 12px;font-size:16px;color:var(--primary)}
  @media(max-width:900px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <h1>高校课程协作与评审平台</h1>
    <p>第六组 · 软件工程课程实验 · 系统实现</p>
    <label>账号</label>
    <input id="username" value="teacher" autocomplete="username">
    <label>密码</label>
    <input id="password" type="password" value="123456" autocomplete="current-password">
    <button class="btn" id="loginBtn">登录</button>
    <div class="err" id="loginErr"></div>
    <div class="demo">
      <div style="font-size:12px;color:#6b7c8f">演示账号（密码均为 123456）</div>
      <span data-u="teacher">教师 王建民</span>
      <span data-u="ta">助教 李思远</span>
      <span data-u="student1">学生 石尚</span>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <span class="brand">高校课程协作与评审平台</span>
    <span class="chip" id="courseChip"></span>
    <span class="spacer"></span>
    <span class="bell" id="bell">🔔<i id="bellBadge" class="hidden">0</i></span>
    <span class="chip" id="userChip"></span>
    <button id="logoutBtn">退出</button>
  </header>
  <div class="shell">
    <aside>
      <div class="who"><b id="whoName"></b><span id="whoRole"></span></div>
      <nav id="nav"></nav>
    </aside>
    <main id="view"></main>
  </div>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>
<script src="/app.js"></script>
</body>
</html>
